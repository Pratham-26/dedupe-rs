[package]
name = "dedupe-rs-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Python bindings for the Rust dedupe port"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
dedupe = { path = "../dedupe-rs" }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
indexmap = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
