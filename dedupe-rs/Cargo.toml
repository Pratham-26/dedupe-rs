[package]
name = "dedupe"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A Rust port of the dedupe Python library for accurate and scalable data deduplication and entity resolution"
license = "MIT"
readme = "README.md"

[lib]
name = "dedupe"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
memmap2 = "0.9"
thiserror = "2"
num-traits = "0.2"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[[bench]]
name = "bench"
harness = false

[features]
default = []
